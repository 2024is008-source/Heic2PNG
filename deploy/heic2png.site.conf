# MANUAL REVIEW ONLY. Never install or reload automatically.
# Replaces ONLY matching heic2png.site server blocks after operator review.
# Do not append duplicate server_name blocks. Do not edit another site's config.
# Prerequisites: Cloudflare Full (strict), reachable origin TLS, valid certificate
# covering BOTH heic2png.site and www.heic2png.site, and the reviewed HEIC release.
# Adjust certificate paths only to this site's actual dedicated certificate.
log_format heic2png_canonical_private '$time_iso8601 $request_method $uri $status';

server {
    listen 80;
    listen [::]:80;
    server_name heic2png.site www.heic2png.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/heic2png.site/acme;
        try_files $uri =404;
    }
    location / { return 301 https://heic2png.site$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.heic2png.site;
    ssl_certificate /etc/letsencrypt/live/heic2png.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heic2png.site/privkey.pem;
    return 301 https://heic2png.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name heic2png.site;
    ssl_certificate /etc/letsencrypt/live/heic2png.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heic2png.site/privkey.pem;
    root /var/www/heic2png.site/current;
    index index.html;
    access_log /var/log/nginx/heic2png.access.log heic2png_canonical_private;
    error_log /var/log/nginx/heic2png.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    # Reject hidden files before any index-alias regex can inspect them.
    location ~ /\. { deny all; }
    location = /sitemap.xml { types { application/xml xml; } try_files $uri =404; }
    location = /site.webmanifest { types { application/manifest+json webmanifest; } try_files $uri =404; }

    location = /index.html { return 301 https://heic2png.site/$is_args$args; }

    # Only existing directory index files redirect; missing aliases stay 404.
    location ~ ^(?<heic_index_directory>/.*/)index\.html$ {
        if (-f $request_filename) {
            return 301 https://heic2png.site$heic_index_directory$is_args$args;
        }
        return 404;
    }

    # All current HTML route segments have no dots. File/endpoint URLs are not
    # slash-normalized. Future routes qualify only when their index file exists.
    location ~ ^(?<heic_slashless>/(?:[^./]+/)*[^./]+)$ {
        if (-f $request_filename/index.html) {
            return 301 https://heic2png.site$heic_slashless/$is_args$args;
        }
        try_files $uri =404;
    }

    # Index file first: avoid an index-module internal redirect meeting the
    # explicit /index.html redirect above and creating a canonical-page loop.
    location / { try_files $uri/index.html $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ^~ /_astro/ { try_files $uri =404; expires 1y; }
    location ^~ /fonts/ {
        types { text/css css; font/ttf ttf; font/woff2 woff2; text/plain txt; }
        try_files $uri =404;
        expires 30d;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/heic2png.site/acme;
        try_files $uri =404;
    }
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
