# Separate site only. Install under /etc/nginx/sites-available/heic2png.site.
# This file is included inside Nginx's http context. No IP or query-string logging.
log_format heic2png_private '$time_iso8601 $request_method $uri $status';
server {
    listen 80;
    listen [::]:80;
    server_name heic2png.site www.heic2png.site;
    root /var/www/heic2png.site/current;
    index index.html;
    access_log /var/log/nginx/heic2png.access.log heic2png_private;
    error_log /var/log/nginx/heic2png.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    # No SPA fallback: missing tools and unpublished articles return HTTP 404.
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ^~ /_astro/ { try_files $uri =404; expires 1y; }
    location ^~ /fonts/ { try_files $uri =404; expires 30d; }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/heic2png.site/acme; }
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
